<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Cafe & Lounge</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { color: #38bdf8; }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card h3 { margin-top: 0; color: #f1f5f9; }
        .badge {
            display: inline-block;
            background-color: #0284c7;
            color: #fff;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            margin-bottom: 10px;
        }
        .price { font-weight: bold; color: #4ade80; font-size: 18px; margin-top: 15px; }
        .btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            width: 100%;
        }
        .btn:hover { background-color: #7dd3fc; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Nightfall Cafe & Lounge</h1>
        <p>Pilih menu minuman favoritmu dan nikmati suasana malam</p>
    </div>

    <div class="grid-container" id="menu-container"></div>

    <script>
        const menuMinuman = [
            {
                nama: "Espresso Single Shot",
                kategori: "Coffee",
                harga: "Rp 20.000",
                deskripsi: "Ekstraksi kopi murni bertubuh tebal dengan crema halus."
            },
            {
                nama: "Matcha Oat Latte",
                kategori: "Non-Coffee",
                harga: "Rp 32.000",
                deskripsi: "Bubuk matcha Uji premium dipadu dengan susu gandum manis alami."
            },
            {
                nama: "Sparkling Berry Mocktail",
                kategori: "Mocktail",
                harga: "Rp 35.000",
                deskripsi: "Kesegaran sirup raspberry, jus lemon, dan soda dingin."
            },
            {
                nama: "Classic Chocolate Iced",
                kategori: "Non-Coffee",
                harga: "Rp 28.000",
                deskripsi: "Cokelat dark belgia dipadukan dengan milk foam lembut."
            }
        ];

        const container = document.getElementById('menu-container');

        menuMinuman.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            
            card.innerHTML = `
                <div>
                    <span class="badge">${item.kategori}</span>
                    <h3>${item.nama}</h3>
                    <p style="color: #94a3b8; font-size: 14px;">${item.deskripsi}</p>
                </div>
                <div>
                    <div class="price">${item.harga}</div>
                    <button class="btn" onclick="pesanMenu('${item.nama}', '${item.harga}')">Pesan Sekarang</button>
                </div>
            `;
            container.appendChild(card);
        });

        function pesanMenu(nama, harga) {
            alert(`Menu "${nama}" (${harga}) berhasil dipilih! Silakan tunggu pesanan Anda diproses.`);
        }
    </script>

</body>
</html>
